name: Deploy repository to Github Pages

on:
  push:
      paths:
      - 'plugins/**'
      - 'plugins.txt'
      - 'sync_plugins.sh'
      branches:
      - main
  # Plugin repos can trigger an immediate sync (see README)
  repository_dispatch:
    types: [plugin-updated]
  # Fallback: pick up plugin repo changes daily
  schedule:
    - cron: '0 6 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: main
    - name: Sync plugins from their repos
      run: bash sync_plugins.sh | tee "$RUNNER_TEMP/synced.txt"
    - name: Commit changes
      id: commit
      run: |
        git add -A plugins
        if git diff --cached --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -q -m "Sync plugins" -m "$(cat "$RUNNER_TEMP/synced.txt")"
        git push
        echo "changed=true" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    # scheduled/dispatched runs only redeploy when a plugin actually changed
    if: needs.sync.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: '0'
    - run: |
        chmod +x build_site.sh
        ./build_site.sh _site/main
    - uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}main/index.yml
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
